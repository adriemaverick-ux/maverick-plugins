<!doctype html><html lang="es" style="color-scheme:light"><head><meta charset="utf-8"><meta name="color-scheme" content="light">
<title>Guion (no se graba)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#F7F4EE;color:#12151C;font-family:Inter,Arial,sans-serif}
header{position:fixed;top:0;left:0;right:0;padding:14px 26px;background:#12151C;color:#fff;font:600 16px 'JetBrains Mono',monospace;letter-spacing:.05em;text-transform:uppercase;display:flex;justify-content:space-between;z-index:2}
header b{color:#FFB020}
main{padding:84px 34px 220px;max-width:980px;margin:0 auto}
.b{padding:24px 28px;margin:0 0 18px;border-radius:20px;border:3px solid #E2DCCF;background:#fff;opacity:.38;transition:all .25s}
.b.a{opacity:1;border-color:#1F6FEB;box-shadow:0 8px 30px rgba(31,111,235,.15)}
.b.s{opacity:.75}
.b small{display:block;font:700 15px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#5B6270;margin-bottom:8px}
.b p{font-size:44px;line-height:1.34;font-weight:600}
.b.a p{font-size:56px}
.b p b{color:#2459C9;font-weight:800}
footer{position:fixed;bottom:0;left:0;right:0;padding:14px 26px;background:#fff;border-top:2px solid #E2DCCF;font-size:17px;color:#5B6270}
</style></head><body>
<header><span>Guion · esta ventana <b>NO se graba</b></span><span id="pos">1 / 7</span></header>
<main id="m"></main>
<footer>Barra espaciadora o flecha ↓ = siguiente · flecha ↑ = anterior. Funciona desde esta ventana o desde la del gráfico. Mantén esta ventana al lado, <b>fuera de la pestaña que grabas</b>.</footer>
<script>
const qp=new URLSearchParams(location.search); const frase=qp.get('frase'); const rub=qp.get('rubro');
let voz='servicio técnico a cocinas y hoteles'; if(frase) voz=frase.toLowerCase(); else if(rub) voz='mantenimiento de '+rub;
const T=[
 `Tu empresa de <b>${voz}</b>, ¿sabe cuántas cotizaciones tiene abiertas <b>en este momento</b>?`,
 `Si para saberlo tienes que abrir chats, el seguimiento <b>depende de tu memoria</b>. Quédate y te enseño cómo ordenarlo.`,
 `Pasa así: la cotización sale por WhatsApp, pasan los días y <b>nadie sabe</b> si la aprobaron, si sigue abierta o a quién le toca preguntar.`,
 `Y esto es lo que <b>casi nadie hace</b>: a cada cotización ponle tres cosas.`,
 `<b>Quién la sigue</b>, <b>qué día se le pregunta</b> al cliente y <b>en qué estado está</b>.`,
 `Enviada, en seguimiento o cerrada. Y <b>míralas todas en una lista</b>.`,
 `Es simple, pero <b>alguien tiene que mirarla cada día</b>. Si este paso se pierde en tu empresa, <b>cuéntame cómo lo llevas hoy</b>.`
];
const etiquetas=['1 · Hook','2 · Que se lo note','3 · El dolor','4 · Re-gancho','5 · La ficha','6 · Estados y lista','7 · Cierre y CTA'];
const m=document.getElementById('m'); let idx=0;
m.innerHTML=T.map((t,i)=>`<div class="b" id="b${i}"><small>${etiquetas[i]}</small><p>${t}</p></div>`).join('');
const canal=('BroadcastChannel' in window)?new BroadcastChannel('maverick-pieza1'):null;
function pinta(){ T.forEach((_,i)=>{const e=document.getElementById('b'+i); e.className='b'+(i===idx?' a':(i===idx+1?' s':''));}); document.getElementById('pos').textContent=(idx+1)+' / 7'; document.getElementById('b'+idx).scrollIntoView({behavior:'smooth',block:'center'}); }
function ir(n,fuera){idx=Math.max(0,Math.min(6,n)); pinta(); if(canal&&!fuera) canal.postMessage({idx});}
if(canal){canal.onmessage=e=>{ if(typeof e.data.idx==='number') ir(e.data.idx,true); };}
addEventListener('keydown',e=>{
 if(['ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();ir(idx+1);}
 else if(['ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();ir(idx-1);}
 else if(e.key==='Home'){e.preventDefault();ir(0);}
});
pinta();
</script></body></html>
